services:
  backend:
    image: ums-backend-dev:local
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "True"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://127.0.0.1:8080}
    volumes:
      - ./backend:/app
      - ums_media_data:/app/media
      - ums_static_data:/app/staticfiles

  celery_worker:
    image: ums-backend-dev:local
    volumes:
      - ./backend:/app

  celery_beat:
    image: ums-backend-dev:local
    volumes:
      - ./backend:/app

  frontend:
    image: ums-frontend-dev:local
    build:
      target: deps
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    tmpfs:
      - /app/.next
    ports:
      - "${UMS_FRONTEND_PORT:-3001}:3000"

volumes:
  frontend_node_modules:
    name: ums_frontend_node_modules

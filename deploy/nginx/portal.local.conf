resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=auth_token:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name localhost 127.0.0.1 _;

    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/auth/login {
        set $portal_backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
    }

    location /api/auth/token/refresh {
        set $portal_backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        limit_req zone=auth_token burst=5 nodelay;
        limit_req_status 429;
    }

    location /api/ {
        set $portal_backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
    }

    location = /super_admin {
        absolute_redirect off;
        return 308 /super_admin/;
    }

    location /super_admin/ {
        set $portal_backend http://backend:8000;
        proxy_pass $portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        limit_req zone=general burst=10 nodelay;
        limit_req_status 429;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /_protected_media/ {
        internal;
        alias /var/www/media/;
        access_log off;
        add_header Cache-Control "private, no-store";
    }

    location ^~ /media/settings/images/ {
        alias /var/www/media/settings/images/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        set $portal_backend http://backend:8000;
        proxy_pass $portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
    }

    location / {
        set $portal_frontend http://frontend:3000;
        proxy_pass $portal_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;

        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
    }
}
